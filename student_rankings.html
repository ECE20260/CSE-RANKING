<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترتيب الطلاب - هندسة الحاسبات والمنظومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --mumtaz-bg: #f0fdf4; --mumtaz-text: #166534; --mumtaz-border: #bbf7d0;
    --jaydj-bg:  #eff6ff; --jaydj-text:  #1e40af; --jaydj-border: #bfdbfe;
    --jayd-bg:   #fefce8; --jayd-text:   #854d0e; --jayd-border:  #fef08a;
    --maqbul-bg: #fff7ed; --maqbul-text: #9a3412; --maqbul-border:#fed7aa;
    --gold: #d4a017; --silver: #94a3b8; --bronze: #b45309;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1a3a6e;
    margin-bottom: 0.25rem;
  }
  header p { font-size: 0.9rem; color: var(--muted); }

  .grade-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .grade-legend span {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
    align-items: center;
  }
  .controls input, .controls select {
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .controls input { flex: 1; min-width: 160px; }
  .controls input:focus, .controls select:focus { border-color: #3b82f6; }
  .count { font-size: 13px; color: var(--muted); margin-right: auto; }

  .table-wrap {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #1a3a6e;
    color: #fff;
    font-weight: 600;
    padding: 11px 10px;
    text-align: right;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    border-left: 1px solid rgba(255,255,255,0.1);
    transition: background 0.15s;
  }
  thead th:hover { background: #254fa0; }
  thead th:first-child { border-left: none; }
  thead th .sort-arrow { font-size: 10px; margin-right: 3px; opacity: 0.5; }
  thead th.active .sort-arrow { opacity: 1; }

  tbody tr { transition: background 0.1s; }
  tbody tr:nth-child(even) { background: #f8fafc; }
  tbody tr:hover { background: #eff6ff; }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }

  .rank-cell { text-align: center; font-weight: 700; font-size: 14px; min-width: 36px; }
  .rank-1 { color: var(--gold); }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }
  .rank-other { color: var(--muted); font-size: 13px; }

  .name-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .score-cell { text-align: center; font-weight: 600; }
  .pct-cell  { text-align: center; color: var(--muted); font-size: 12px; }
  .yr-cell   { text-align: center; color: var(--muted); }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid;
    white-space: nowrap;
  }
  .b-mm { background: var(--mumtaz-bg); color: var(--mumtaz-text); border-color: var(--mumtaz-border); }
  .b-jj { background: var(--jaydj-bg);  color: var(--jaydj-text);  border-color: var(--jaydj-border); }
  .b-j  { background: var(--jayd-bg);   color: var(--jayd-text);   border-color: var(--jayd-border); }
  .b-mq { background: var(--maqbul-bg); color: var(--maqbul-text); border-color: var(--maqbul-border); }

  .bar-wrap { display: flex; align-items: center; gap: 6px; min-width: 80px; }
  .bar-bg { flex: 1; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

  @media (max-width: 640px) {
    .yr-cell, .pct-cell { display: none; }
    .name-cell { max-width: 130px; }
  }
</style>
</head>
<body>

<header>
  <h1>ترتيب طلاب هندسة الحاسبات والمنظومات</h1>
  <p>جامعة الزقازيق — مجموع الأربع سنوات من 4800</p>
</header>

<div class="grade-legend">
  <span class="badge b-mm">ممتاز — 89.5% فأكثر (4296+)</span>
  <span class="badge b-jj">جيد جدا — 79.5% فأكثر (3816+)</span>
  <span class="badge b-j">جيد — 69.5% فأكثر (3336+)</span>
  <span class="badge b-mq">مقبول — 59.5% فأكثر (2856+)</span>
</div>

<div class="controls">
  <input type="text" id="srch" placeholder="ابحث باسم الطالب..." oninput="render()">
  <select id="grFilter" onchange="render()">
    <option value="">كل التقديرات</option>
    <option value="ممتاز">ممتاز</option>
    <option value="جيد جدا">جيد جدا</option>
    <option value="جيد">جيد</option>
    <option value="مقبول">مقبول</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('rank')" id="h-rank">ترتيب <span class="sort-arrow">↑</span></th>
        <th onclick="sortBy('name')" id="h-name">اسم الطالب <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('y1')"   id="h-y1">إعدادية <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('y2')"   id="h-y2">أولى <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('y3')"   id="h-y3">ثانية <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('y4')"   id="h-y4">ثالثة <span class="sort-arrow">↕</span></th>
        <th onclick="sortBy('total')" id="h-total">المجموع / 4800 <span class="sort-arrow">↕</span></th>
        <th>التقدير</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const MAX = 4800;
const MUMTAZ_PCT = 89.5;
const JAYDJ_PCT  = 79.5;
const JAYD_PCT   = 69.5;
const MAQBUL_PCT = 59.5;

function getGrade(total){
  const pct = total / MAX * 100;
  if(pct >= MUMTAZ_PCT) return 'ممتاز';
  if(pct >= JAYDJ_PCT)  return 'جيد جدا';
  if(pct >= JAYD_PCT)   return 'جيد';
  if(pct >= MAQBUL_PCT) return 'مقبول';
  return 'راسب';
}
function badgeCls(g){
  return g==='ممتاز'?'b-mm':g==='جيد جدا'?'b-jj':g==='جيد'?'b-j':'b-mq';
}
function barColor(g){
  return g==='ممتاز'?'#22c55e':g==='جيد جدا'?'#3b82f6':g==='جيد'?'#eab308':'#f97316';
}

let allData = raw.map(s=>({...s, total: s.y1+s.y2+s.y3+s.y4}));
allData.sort((a,b)=>b.total-a.total);
allData = allData.map((d,i)=>({...d, rank:i+1, grade:getGrade(d.total), pct:(d.total/MAX*100).toFixed(2)}));

let sortCol='rank', sortAsc=true;

function sortBy(col){
  if(sortCol===col) sortAsc=!sortAsc; else { sortCol=col; sortAsc=true; }
  document.querySelectorAll('thead th').forEach(th=>{
    th.classList.remove('active');
    th.querySelector('.sort-arrow').textContent='↕';
  });
  const hEl = document.getElementById('h-'+col);
  if(hEl){ hEl.classList.add('active'); hEl.querySelector('.sort-arrow').textContent=sortAsc?'↑':'↓'; }
  render();
}

function render(){
  const srch = document.getElementById('srch').value.trim();
  const gr   = document.getElementById('grFilter').value;
  let view = [...allData];
  if(srch) view = view.filter(d=>d.name.includes(srch));
  if(gr)   view = view.filter(d=>d.grade===gr);

  const cols = {name:(a,b)=>a.name.localeCompare(b.name,'ar'), rank:(a,b)=>a.rank-b.rank,
    y1:(a,b)=>a.y1-b.y1, y2:(a,b)=>a.y2-b.y2, y3:(a,b)=>a.y3-b.y3, y4:(a,b)=>a.y4-b.y4,
    total:(a,b)=>a.total-b.total};
  if(cols[sortCol]) view.sort((a,b)=> sortAsc ? cols[sortCol](a,b) : -cols[sortCol](a,b));

  document.getElementById('count').textContent = `إجمالي: ${view.length} طالب`;

  document.getElementById('tbody').innerHTML = view.map(d=>{
    const rankCls = d.rank===1?'rank-1':d.rank===2?'rank-2':d.rank===3?'rank-3':'rank-other';
    const rankIcon = d.rank===1?'🥇':d.rank===2?'🥈':d.rank===3?'🥉':d.rank;
    const barPct = Math.min(100, d.total/MAX*100).toFixed(1);
    const bc = barColor(d.grade);
    return `<tr>
      <td class="rank-cell ${rankCls}">${rankIcon}</td>
      <td class="name-cell" title="${d.name}">${d.name}</td>
      <td class="yr-cell">${d.y1}</td>
      <td class="yr-cell">${d.y2}</td>
      <td class="yr-cell">${d.y3}</td>
      <td class="yr-cell">${d.y4}</td>
      <td>
        <div class="bar-wrap">
          <span class="score-cell" style="min-width:46px">${d.total.toFixed(1)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${barPct}%;background:${bc}"></div></div>
          <span class="pct-cell" style="min-width:40px">${d.pct}%</span>
        </div>
      </td>
      <td><span class="badge ${badgeCls(d.grade)}">${d.grade}</span></td>
    </tr>`;
  }).join('');
}

document.getElementById('h-rank').classList.add('active');
document.getElementById('h-rank').querySelector('.sort-arrow').textContent='↑';
render();
</script>
</body>
</html>
